# Optional local/production overlay. Default Compose needs no encryption secret.
services:
  api:
    environment:
      COPILOT_MASTER_KEY_FILE: /run/secrets/copilot_master_keyring
    secrets:
      - copilot_master_keyring
secrets:
  copilot_master_keyring:
    file: ${COPILOT_MASTER_KEYRING_PATH:?Set an absolute protected keyring path outside the repository}
