openapi: 3.1.0
info:
  title: Beforebuy Shopping Copilot API
  version: 0.5.1-contextual-assistant
  description: |
    Same-origin guest-owned Milestone A/B contract. Unsafe requests require the
    existing csrftoken cookie and matching X-CSRFToken header. Missing, foreign,
    deleted and expired resources all return RESOURCE_UNAVAILABLE.
servers: [{url: /api/v1}]
paths:
  /copilot/settings:
    $ref: './personalization.yaml#/settings'
  /copilot/models/refresh:
    $ref: './personalization.yaml#/modelsRefresh'
  /copilot/credential:
    $ref: './personalization.yaml#/credential'
  /copilot/memory:
    $ref: './personalization.yaml#/memory'
  /copilot/memory/export:
    $ref: './personalization.yaml#/export'
  /copilot/memory/{memoryId}:
    $ref: './personalization.yaml#/memoryDetail'
  /conversations/{conversationId}/memory:
    $ref: './personalization.yaml#/conversationMemory'
  /conversations/{conversationId}/choices:
    parameters: [{$ref: '#/components/parameters/ConversationId'}]
    get:
      operationId: getChoiceDesk
      summary: Latest immutable comparison, with current=false after revision or freshness expiry; no execution
      responses:
        '200': {description: ChoiceSet or null, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ChoiceSet'}, {type: 'null'}]}}}}
        '404': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: compareChoices
      summary: Compare confirmed brief against owned persisted evidence without any network or LLM calls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision, variant_ids, intended_variant_id]
              properties:
                expected_revision: {type: integer, minimum: 0}
                variant_ids: {type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: {type: string, format: uuid}}
                intended_variant_id: {type: string, format: uuid, description: Must be included in variant_ids; one variant per product and one category}
      responses:
        '201': {description: Published after owner/expiry/revision/epoch check, content: {application/json: {schema: {$ref: '#/components/schemas/ChoiceSet'}}}}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {description: STALE_BRIEF_REVISION or STALE_COMPARISON; confirm/recompute explicitly}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /conversations/{conversationId}/choices/candidates:
    parameters: [{$ref: '#/components/parameters/ConversationId'}]
    get:
      operationId: listChoiceCandidates
      summary: Candidates from at most 200 latest owned extracted snapshots; does not execute retrieval
      responses:
        '200': {description: Candidate variants with product identity, normalized claims, offers and source attribution, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}}}}}}
        '404': {$ref: '#/components/responses/Unavailable'}
  /conversations/{conversationId}/choices/demo:
    parameters: [{$ref: '#/components/parameters/ConversationId'}]
    post:
      operationId: seedChoiceDemonstration
      summary: Explicitly seed or reuse three SYNTHETIC products using normal evidence entities; does not change the brief or call sources
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [expected_revision, category], properties: {expected_revision: {type: integer, minimum: 0}, category: {type: string, enum: [electronics, home, sports]}}}}}
      responses:
        '201': {description: Synthetic variant_ids for this conversation, content: {application/json: {schema: {type: object, properties: {variant_ids: {type: array, items: {type: string, format: uuid}}, attribution: {const: SYNTHETIC}}}}}}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {description: Brief must be confirmed at expected_revision}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /session:
    get:
      summary: Reuse the existing guest and CSRF bootstrap
      operationId: bootstrapSession
      responses:
        '200':
          description: Guest session ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
              example: {expires_at: '2027-02-13T10:30:00Z'}
  /conversations:
    get:
      summary: List owned unexpired conversations without extending retention
      operationId: listConversations
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: Reverse-chronological page
          content: {application/json: {schema: {$ref: '#/components/schemas/ConversationPage'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
    post:
      summary: Create a category-neutral conversation and empty brief
      operationId: createConversation
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateConversationRequest'}, example: {title: خرید بعدی من}}}
      responses:
        '201':
          description: Created with brief revision zero
          content: {application/json: {schema: {$ref: '#/components/schemas/ConversationDetail'}}}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /conversations/{conversationId}:
    parameters: [{$ref: '#/components/parameters/ConversationId'}]
    get:
      summary: Read authoritative state; never execute or extend retention
      operationId: getConversation
      responses:
        '200': {description: Current state, content: {application/json: {schema: {$ref: '#/components/schemas/ConversationDetail'}}}}
        '404': {$ref: '#/components/responses/Unavailable'}
    delete:
      summary: Delete, cancel work and invalidate late publication
      operationId: deleteConversation
      responses:
        '204': {description: Deleted; repeating returns unavailable}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '404': {$ref: '#/components/responses/Unavailable'}
  /conversations/{conversationId}/messages:
    post:
      summary: Accept a message and schedule one bounded contextual operation
      operationId: submitMessage
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitMessageRequest'}
            example: {text: برای خرید لپ‌تاپ کمک می‌خواهم., upload_ids: [], expected_brief_revision: 0}
      responses:
        '202':
          description: New acceptance or identical idempotent replay
          content: {application/json: {schema: {$ref: '#/components/schemas/AcceptedOperation'}}}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409':
          description: Stale brief or idempotency-key payload conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                stale: {value: {error: {code: STALE_BRIEF_REVISION, message: Brief changed., current_revision: 2}}}
                key: {value: {error: {code: IDEMPOTENCY_CONFLICT, message: Idempotency key belongs to another payload.}}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {description: Two guest operations are already pending/running, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /conversations/{conversationId}/brief:
    parameters: [{$ref: '#/components/parameters/ConversationId'}]
    get:
      summary: Read current brief without extending retention
      operationId: getBrief
      responses:
        '200': {description: Current revision, content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingBrief'}}}}
        '404': {$ref: '#/components/responses/Unavailable'}
    patch:
      summary: Compare-and-swap explicit edit and invalidate stale output
      operationId: editBrief
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EditBriefRequest'}}}
      responses:
        '200': {description: New revision and retention anchor, content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingBrief'}}}}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/StaleRevision'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /conversations/{conversationId}/brief/confirm:
    post:
      summary: Confirm an exact brief revision
      operationId: confirmBrief
      parameters: [{$ref: '#/components/parameters/ConversationId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties: {expected_revision: {type: integer, minimum: 0}}
      responses:
        '200': {description: Confirmed and retention anchor advanced, content: {application/json: {schema: {$ref: '#/components/schemas/ShoppingBrief'}}}}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/StaleRevision'}
  /operations/{operationId}:
    get:
      summary: Reconcile authoritative state; never execute or retry
      operationId: getOperation
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      responses:
        '200': {description: Current operation, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
        '404': {$ref: '#/components/responses/Unavailable'}
  /operations/{operationId}/events:
    get:
      summary: Replay/follow stored events; never start or restart execution
      operationId: streamOperationEvents
      parameters:
        - {$ref: '#/components/parameters/OperationId'}
        - {name: Last-Event-ID, in: header, required: false, description: 'Must be {operationId}:{sequence}.', schema: {type: string, maxLength: 80, pattern: '^[0-9a-fA-F-]{36}:[0-9]+$'}}
      responses:
        '200':
          description: Versioned frames; heartbeat comments are not progress
          headers:
            Cache-Control: {schema: {type: string}, example: no-cache}
            X-Accel-Buffering: {schema: {type: string}, example: 'no'}
          content:
            text/event-stream:
              schema: {type: string}
              example: "id: 9ea71b3a-b30d-4dfb-bbf3-b7f26777f5c1:1\nevent: operation.started\ndata: {\"schema_version\":\"COPILOT-STREAM-v1\",\"sequence\":1}\n\n"
        '400': {description: Malformed or foreign replay ID, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}, example: {error: {code: INVALID_REPLAY_ID, message: Last-Event-ID is invalid.}}}}}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {description: Replay gap or future sequence; reconcile via REST without regeneration, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}, example: {error: {code: REPLAY_GAP, message: Retained events do not cover that sequence., reconcile_url: /api/v1/operations/9ea71b3a-b30d-4dfb-bbf3-b7f26777f5c1}}}}}
        '429': {description: Per-process SSE subscriber admission is full; retry later while status/cancel capacity remains available, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}, example: {error: {code: STREAM_CAPACITY_REACHED, message: Stream capacity is temporarily full.}}}}}
  /operations/{operationId}/cancel:
    post:
      summary: Cancel independently of the SSE connection
      operationId: cancelOperation
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      responses:
        '202': {description: Newly requested, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
        '200': {description: Duplicate cancellation is idempotent, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {description: Operation already completed/failed/interrupted, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /uploads:
    post:
      summary: Validate, strip metadata and store a protected image for at most 24h
      operationId: createUpload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [conversation_id, image]
              properties:
                conversation_id: {type: string, format: uuid}
                image: {type: string, format: binary, description: JPEG/PNG/WebP; raw bytes at most 5 MiB}
      responses:
        '201': {description: Decoded and sanitized; max 3 active per conversation, content: {application/json: {schema: {$ref: '#/components/schemas/Upload'}}}}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '413': {description: Byte/dimension/pixel/decompression bound exceeded, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '415': {description: Decoded type unsupported; SVG/HTML rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {description: Three unexpired uploads already exist, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /uploads/{uploadId}:
    parameters: [{$ref: '#/components/parameters/UploadId'}]
    get:
      summary: Read sanitized bytes through owner authorization; no public URL
      operationId: getUpload
      responses:
        '200':
          description: Sanitized bytes
          headers:
            Cache-Control: {schema: {type: string}, example: 'private, no-store'}
            Content-Security-Policy: {schema: {type: string}, example: "default-src 'none'; sandbox"}
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/Unavailable'}
    delete:
      summary: Delete an unconsumed owned upload
      operationId: deleteUpload
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {description: Already referenced by an accepted message, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /conversations/{conversationId}/research:
    post:
      summary: Explicitly start one bounded owner-scoped research job; never called by GET/replay
      operationId: startResearch
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResearchStartRequest'}
            example: {expected_brief_revision: 1, targets: [{source_id: synthetic-appliance-v1}]}
      responses:
        '202': {description: Scheduled fixture/live-labeled job or identical active replay, content: {application/json: {schema: {$ref: '#/components/schemas/ResearchAccepted'}}}}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {description: Offline، unconfirmed/stale brief or idempotency conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {description: One active job per guest or process admission full, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /research-jobs/{jobId}:
    get:
      summary: Read authoritative owner-scoped job/coverage; never starts or repeats network work
      operationId: getResearchJob
      parameters: [{$ref: '#/components/parameters/ResearchJobId'}]
      responses:
        '200': {description: Current bounded progress and attributed snapshots, content: {application/json: {schema: {$ref: '#/components/schemas/ResearchJob'}}}}
        '404': {$ref: '#/components/responses/Unavailable'}
  /research-jobs/{jobId}/cancel:
    post:
      summary: Cooperatively cancel job independent of event stream
      operationId: cancelResearchJob
      parameters: [{$ref: '#/components/parameters/ResearchJobId'}]
      responses:
        '202': {description: Newly cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/ResearchCancelResult'}}}}
        '200': {description: Idempotent already-cancelled state, content: {application/json: {schema: {$ref: '#/components/schemas/ResearchCancelResult'}}}}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {description: Already terminal with another outcome, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
components:
  parameters:
    ConversationId: {name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}
    OperationId: {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
    UploadId: {name: uploadId, in: path, required: true, schema: {type: string, format: uuid}}
    ResearchJobId: {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    Cursor: {name: cursor, in: query, description: Opaque cursor, schema: {type: string, maxLength: 256}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}}
  responses:
    CsrfRejected: {description: Missing/invalid same-origin CSRF proof, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}, example: {error: {code: CSRF_FAILED, message: CSRF verification failed.}}}}}
    InvalidRequest: {description: Invalid query/header, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    ValidationFailed: {description: Invalid bounded input, content: {application/json: {schema: {$ref: '#/components/schemas/ValidationProblem'}}}}
    Unavailable: {description: Missing/foreign/expired/deleted, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}, example: {error: {code: RESOURCE_UNAVAILABLE, message: این منبع در دسترس نیست.}}}}}
    StaleRevision: {description: Expected revision is stale, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}, example: {error: {code: STALE_BRIEF_REVISION, message: Brief changed., current_revision: 3}}}}}
  schemas:
    ComparisonProfile:
      type: object
      additionalProperties: false
      properties:
        intent: {type: string, enum: [UNKNOWN, PRACTICAL, ENJOYMENT, GIFT, HOUSEHOLD], default: UNKNOWN}
        budget_mode: {type: string, enum: [STRICT, FLEXIBLE], default: STRICT}
        prefer_lower_cost: {type: boolean, default: false}
        criteria:
          type: array
          maxItems: 6
          description: One criterion per field; equality, not inferred minimum; category and exact value type checked
          items:
            type: object
            additionalProperties: false
            required: [field, expected, kind, scope]
            properties:
              field: {type: string, enum: [capacity_gb, portable, capacity_l, dishwasher_safe, size_eu, waterproof]}
              expected: {oneOf: [{type: boolean}, {type: integer, minimum: 1, maximum: 100000}]}
              kind: {type: string, enum: [HARD, PREFERENCE]}
              scope: {type: string, enum: [SELF, RECIPIENT, HOUSEHOLD]}
    ChoiceSet:
      type: object
      required: [id, brief_revision, current, evidence_valid_until, result, created_at]
      properties:
        id: {type: string, format: uuid}
        brief_revision: {type: integer, minimum: 0}
        current: {type: boolean}
        evidence_valid_until: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        result:
          type: object
          required: [rule_version, brief_snapshot, outcome, leaders, items, clarification, response_mode, intent, scope, no_alternatives]
          properties:
            rule_version: {const: COPILOT-RANK-v0.1}
            brief_snapshot: {type: object, description: Immutable comparison inputs only; private to the conversation owner and its retention}
            response_mode: {const: DETERMINISTIC_TEMPLATE}
            outcome: {enum: [SUPPORTED_CHOICE, TIED, UNRESOLVED, NO_SUPPORTED_CHOICE]}
            leaders: {type: array, items: {type: string, format: uuid}}
            no_alternatives: {type: boolean}
            intent: {type: string}
            scope: {enum: [SELF, RECIPIENT, HOUSEHOLD]}
            clarification: {type: [string, 'null']}
            items:
              type: array
              maxItems: 4
              items:
                type: object
                required: [id, product_id, name, intended, group, checks, total, item_price, cost_state, unknowns, tradeoffs, coverage, would_change_if, sources, offers]
                properties:
                  id: {type: string, format: uuid}
                  product_id: {type: string, format: uuid}
                  name: {type: string}
                  intended: {type: boolean}
                  group: {enum: [SUPPORTED, UNRESOLVED, INCOMPATIBLE]}
                  total: {type: [integer, 'null'], minimum: 0, description: Normalized toman; complete supported in-stock total only}
                  item_price: {type: [integer, 'null'], minimum: 0}
                  cost_state: {enum: [WITHIN_BUDGET_CONFIRMED, ABOVE_BUDGET, UNKNOWN]}
                  checks: {type: array, items: {type: object, required: [field, expected, kind, scope, result, actual, evidence_id, attribution]}}
                  sources: {type: array, items: {type: object, required: [id, attribution, url, label, observed_at, fresh_until, fresh]}}
                  offers: {type: array, items: {type: object, required: [id, price, shipping, mandatory, stock, fresh, source_id, attribution, observation_kind, url, observed_at]}}
                  unknowns: {type: array, items: {type: string}}
                  tradeoffs: {type: array, items: {type: string}}
                  would_change_if: {type: array, items: {type: string}}
                  coverage: {type: object, required: [known, total], properties: {known: {type: integer, minimum: 0}, total: {type: integer, minimum: 0}}}
    Problem:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: true
          required: [code, message]
          properties:
            code: {type: string, maxLength: 64}
            message: {type: string, maxLength: 500}
            current_revision: {type: integer, minimum: 0}
            reconcile_url: {type: string, maxLength: 300}
    ValidationProblem:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - {type: object, properties: {error: {type: object, properties: {field_errors: {type: object, additionalProperties: {type: array, items: {type: string, maxLength: 200}}}}}}}
    Session:
      type: object
      additionalProperties: false
      required: [expires_at]
      properties: {expires_at: {type: string, format: date-time}}
    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        temporary: {type: boolean, default: false, description: Immutable; no persistent preference reads or writes}
    ConversationSummary:
      type: object
      additionalProperties: false
      required: [id, status, title, brief_revision, created_at, updated_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [ACTIVE]}
        temporary: {type: boolean}
        title: {type: string, maxLength: 120}
        brief_revision: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    ConversationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/ConversationSummary'}}
        next_cursor: {type: [string, 'null'], maxLength: 256}
    ConversationDetail:
      allOf:
        - {$ref: '#/components/schemas/ConversationSummary'}
        - {type: object, required: [brief, messages, operations], properties: {brief: {$ref: '#/components/schemas/ShoppingBrief'}, messages: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Message'}}, operations: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Operation'}}}}
    Message:
      type: object
      additionalProperties: false
      required: [id, role, state, text, upload_ids, created_at]
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [USER, ASSISTANT]}
        state: {type: string, enum: [ACCEPTED, FINAL, FAILED, CANCELLED]}
        text: {type: string, maxLength: 12000}
        upload_ids: {type: array, maxItems: 3, items: {type: string, format: uuid}}
        created_at: {type: string, format: date-time}
    ShoppingBrief:
      type: object
      additionalProperties: false
      required: [revision, recipient_context, category, selected_product_label, budget_toman, use_cases, hard_constraints, unknowns, contradictions, provenance, confirmed, updated_at]
      properties:
        comparison: {$ref: '#/components/schemas/ComparisonProfile'}
        revision: {type: integer, minimum: 0}
        recipient_context: {type: [string, 'null'], enum: [SELF, GIFT, HOUSEHOLD, null]}
        category: {type: [string, 'null'], maxLength: 120}
        selected_product_label: {type: [string, 'null'], maxLength: 160}
        budget_toman: {type: [integer, 'null'], minimum: 0, description: null is unknown; zero is explicit}
        use_cases: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 200}}
        hard_constraints: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 200}}
        unknowns: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 200}}
        contradictions: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 300}}
        provenance: {type: array, maxItems: 100, items: {type: object, additionalProperties: false, required: [field, source_type, source_id], properties: {field: {type: string, maxLength: 64}, source_type: {type: string, enum: [MESSAGE, EXPLICIT_EDIT]}, source_id: {type: string, format: uuid}}}}
        confirmed: {type: boolean}
        updated_at: {type: string, format: date-time}
    EditBriefRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, changes]
      properties:
        expected_revision: {type: integer, minimum: 0}
        changes:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            comparison: {$ref: '#/components/schemas/ComparisonProfile'}
            recipient_context: {type: [string, 'null'], enum: [SELF, GIFT, HOUSEHOLD, null]}
            category: {type: [string, 'null'], maxLength: 120}
            selected_product_label: {type: [string, 'null'], maxLength: 160}
            budget_toman: {type: [integer, 'null'], minimum: 0}
            use_cases: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 200}}
            hard_constraints: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 200}}
            unknowns: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 200}}
            contradictions: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 300}}
    SubmitMessageRequest:
      type: object
      additionalProperties: false
      required: [text, expected_brief_revision]
      properties:
        text: {type: string, minLength: 1, maxLength: 8000}
        upload_ids: {type: array, uniqueItems: true, maxItems: 3, items: {type: string, format: uuid}, default: []}
        expected_brief_revision: {type: integer, minimum: 0}
    AcceptedOperation:
      type: object
      additionalProperties: false
      required: [operation, message_id, idempotent_replay, events_url]
      properties:
        operation: {$ref: '#/components/schemas/Operation'}
        message_id: {type: string, format: uuid}
        idempotent_replay: {type: boolean}
        events_url: {type: string, maxLength: 300}
    Operation:
      type: object
      additionalProperties: false
      required: [id, conversation_id, status, operation_kind, expected_brief_revision, final_message_id, terminal_code, created_at, updated_at, started_at, completed_at]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED, INTERRUPTED]}
        operation_kind: {type: string, enum: [CONVERSATION, RESEARCH]}
        expected_brief_revision: {type: integer, minimum: 0}
        final_message_id: {type: [string, 'null'], format: uuid}
        terminal_code: {type: [string, 'null'], maxLength: 64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
    Upload:
      type: object
      additionalProperties: false
      required: [id, conversation_id, media_type, size_bytes, width, height, sha256, created_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        media_type: {type: string, enum: [image/jpeg, image/png, image/webp]}
        size_bytes: {type: integer, minimum: 1, maximum: 5242880}
        width: {type: integer, minimum: 1, maximum: 4096}
        height: {type: integer, minimum: 1, maximum: 4096}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}

    ResearchStartRequest:
      type: object
      additionalProperties: false
      required: [expected_brief_revision, targets]
      properties:
        expected_brief_revision: {type: integer, minimum: 0}
        targets: {type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: {$ref: '#/components/schemas/ResearchTarget'}}
    ResearchTarget:
      type: object
      additionalProperties: false
      required: [source_id]
      properties:
        source_id: {type: string, minLength: 1, maxLength: 253}
        url: {type: [string, 'null'], format: uri, maxLength: 1000, description: Required in LIVE mode; exact product URL, never a domain-only discovery request.}
    ResearchLimits:
      type: object
      additionalProperties: false
      required: [max_domains, max_pages_per_domain, max_redirects_per_request, max_total_requests, max_decoded_bytes_per_page, max_wire_bytes_per_page, request_timeout_seconds, job_deadline_seconds, outbound_concurrency_per_process, min_domain_interval_ms]
      properties:
        max_domains: {type: integer, maximum: 3}
        max_pages_per_domain: {type: integer, maximum: 5}
        max_redirects_per_request: {type: integer, maximum: 2}
        max_total_requests: {type: integer, maximum: 20}
        max_decoded_bytes_per_page: {type: integer, maximum: 2097152}
        max_wire_bytes_per_page: {type: integer, maximum: 2097152}
        request_timeout_seconds: {type: integer, maximum: 20}
        job_deadline_seconds: {type: integer, maximum: 60}
        outbound_concurrency_per_process: {type: integer, maximum: 2}
        min_domain_interval_ms: {type: integer, minimum: 1000}
    EvidenceClaim:
      type: object
      additionalProperties: false
      required: [field, normalized_value, source_location, evidence_status, variant]
      properties:
        field: {type: string, maxLength: 120}
        normalized_value: {type: [object, 'null'], additionalProperties: true}
        source_location: {type: [string, 'null'], maxLength: 500}
        evidence_status: {type: string, enum: [SUPPORTED, UNKNOWN, CONFLICTING, STALE]}
        variant: {$ref: '#/components/schemas/VariantIdentity'}
    VariantIdentity:
      type: [object, 'null']
      additionalProperties: false
      required: [id, brand, model_name, canonical_identifier, identifiers, attributes, region, bundle, condition]
      properties:
        id: {type: string, format: uuid}
        brand: {type: string, maxLength: 120}
        model_name: {type: string, maxLength: 200}
        canonical_identifier: {type: [string, 'null'], maxLength: 160}
        identifiers: {type: object, additionalProperties: true}
        attributes: {type: object, additionalProperties: true}
        region: {type: [string, 'null'], maxLength: 80}
        bundle: {type: boolean}
        condition: {type: string, enum: [NEW, USED, REFURBISHED, UNKNOWN]}
    ResearchSnapshot:
      type: object
      additionalProperties: false
      required: [id, source_role, canonical_url, fixture_label, retrieval_time, status, failure_code, fingerprint, extractor_version, offers, claims]
      properties:
        id: {type: string, format: uuid}
        source_role: {type: string, enum: [MANUFACTURER, MERCHANT, COMPARISON, EXPERT, CUSTOMER_REVIEW]}
        canonical_url: {type: [string, 'null'], maxLength: 1000}
        fixture_label: {type: [string, 'null'], maxLength: 120}
        retrieval_time: {type: string, format: date-time}
        status: {type: string, enum: [EXTRACTED, CACHE_HIT, BLOCKED, FAILED]}
        failure_code: {type: [string, 'null'], maxLength: 64}
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        extractor_version: {type: [string, 'null'], maxLength: 64}
        offers: {type: array, items: {$ref: '#/components/schemas/ResearchOffer'}}
        claims: {type: array, items: {$ref: '#/components/schemas/EvidenceClaim'}}
    ResearchOffer:
      type: object
      additionalProperties: false
      required: [item_price_minor, currency, price_toman, shipping_minor, mandatory_charges_minor, total_payable_minor, seller, merchant_url, observation_kind, warranty, registration, availability, observed_at]
      properties:
        item_price_minor: {type: [integer, 'null'], minimum: 0}
        currency: {type: [string, 'null'], maxLength: 12}
        price_toman: {type: [integer, 'null'], minimum: 0}
        shipping_minor: {type: [integer, 'null'], minimum: 0}
        mandatory_charges_minor: {type: [integer, 'null'], minimum: 0}
        total_payable_minor: {type: [integer, 'null'], minimum: 0}
        seller: {type: [string, 'null'], maxLength: 200}
        merchant_url: {type: [string, 'null'], maxLength: 1000}
        observation_kind: {type: string, enum: [COMPARISON_OBSERVED, MERCHANT_PAGE_VERIFIED]}
        warranty: {type: [string, 'null'], maxLength: 200}
        registration: {type: [string, 'null'], maxLength: 200}
        availability: {type: string, enum: [IN_STOCK, OUT_OF_STOCK, PREORDER, UNKNOWN]}
        observed_at: {type: string, format: date-time}
    ResearchJob:
      type: object
      additionalProperties: false
      required: [id, conversation_id, operation_id, mode, fixture_labeled, status, stage, completed, total, request_count, decoded_bytes, wire_bytes, redirect_count, targets, brief_revision, current_for_brief, coverage, limits, offers, snapshots, created_at, started_at, completed_at]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        operation_id: {type: string, format: uuid}
        mode: {type: string, enum: [FIXTURE, LIVE]}
        fixture_labeled: {type: boolean}
        status: {type: string, enum: [PENDING, RUNNING, SUCCESS, PARTIAL_SUCCESS, NO_SUPPORTED_SOURCES, BLOCKED_SOURCE, EXTRACTION_FAILED, TIMED_OUT, CANCELLED, INTERRUPTED, FAILED]}
        stage: {type: string, maxLength: 32}
        completed: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0, maximum: 3}
        request_count: {type: integer, minimum: 0, maximum: 20, description: "Conservative request budget usage including failed connection attempts and validated-address fallback; not a count of successful HTTP responses."}
        decoded_bytes: {type: integer, minimum: 0}
        wire_bytes: {type: integer, minimum: 0}
        redirect_count: {type: integer, minimum: 0}
        targets: {type: array, minItems: 1, maxItems: 3, items: {$ref: '#/components/schemas/ResearchTarget'}}
        brief_revision: {type: integer, minimum: 0}
        current_for_brief: {type: boolean}
        coverage: {type: object, additionalProperties: true}
        limits: {$ref: '#/components/schemas/ResearchLimits'}
        offers:
          type: array
          description: Deterministic comparable-offer view; raw observations remain in snapshots.
          items:
            type: object
            additionalProperties: true
        snapshots: {type: array, maxItems: 15, items: {$ref: '#/components/schemas/ResearchSnapshot'}}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
    ResearchAccepted:
      type: object
      additionalProperties: false
      required: [job, operation, idempotent_replay, events_url]
      properties:
        job: {$ref: '#/components/schemas/ResearchJob'}
        operation: {$ref: '#/components/schemas/Operation'}
        idempotent_replay: {type: boolean}
        events_url: {type: string, maxLength: 300}
    ResearchCancelResult:
      type: object
      additionalProperties: false
      required: [job, operation]
      properties:
        job: {$ref: '#/components/schemas/ResearchJob'}
        operation: {$ref: '#/components/schemas/Operation'}

