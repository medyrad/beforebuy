services:
  db:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beforebuy}
      POSTGRES_USER: ${POSTGRES_USER:-beforebuy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beforebuy-development}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55439}:5432"
    volumes:
      - beforebuy_pgdata_v18:/var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: ["gunicorn", "--chdir", "backend", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--worker-class", "gthread", "--threads", "4", "--timeout", "45", "--graceful-timeout", "10", "--access-logfile", "-"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; connection = socket.create_connection(('127.0.0.1', 8000), 2); connection.close()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${API_HOST_PORT:-58000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        NGINX_CONFIG: deploy/web.dev.conf
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-58080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

volumes:
  beforebuy_pgdata_v18:
    name: beforebuy_beforebuy_pgdata_v18
